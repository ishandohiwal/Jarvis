<!DOCTYPE html>
<html lang="en"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini Hub - Standalone</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#000;color:#fff;font-family:Inter,system-ui,sans-serif}
header{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:10}
.logo{font-weight:800;font-size:20px} .logo span{background:linear-gradient(90deg,#8b5cf6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.card{background:#0a0a0a;border:1px solid #222;border-radius:18px;padding:16px;margin-bottom:14px}
input,select,textarea{width:100%;background:#111;border:1px solid #333;color:#fff;border-radius:12px;padding:12px;margin:6px 0;outline:none}
button{background:linear-gradient(90deg,#8b5cf6,#06b6d4);border:none;color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;cursor:pointer}
button.ghost{background:#1a1a1a} .row{display:flex;gap:10px;flex-wrap:wrap} .row>*{flex:1}
.pill{padding:8px 14px;border-radius:999px;background:#151515;border:1px solid #333;cursor:pointer;font-size:13px} .pill.active{background:#8b5cf6;border-color:#8b5cf6}
.msg{padding:12px 14px;border-radius:16px;margin:10px 0;white-space:pre-wrap;line-height:1.6} .user{background:#1e1b4b;margin-left:40px} .ai{background:#111;margin-right:20px;border:1px solid #222}
small{color:#888} label{font-size:12px;color:#aaa} input[type=range]{padding:0}
.chip{font-size:12px;background:#1a1a1a;border:1px solid #333;padding:6px 10px;border-radius:999px;cursor:pointer}
pre{background:#000;padding:10px;border-radius:10px;overflow:auto}
</style></head>
<body>
<header><div class="logo">Gemini <span>Hub</span></div><div><small id="keyBadge">No key</small></div></header>
<div class="wrap">
<div class="card"><h3 style="margin:0">1. Paste your API Key</h3><small>Supports new AQ.Ab... Auth keys + old AIza keys. Saved only in YOUR browser (localStorage).</small>
<input id="apiKey" type="password" placeholder="Paste AQ.Ab... key here">
<div class="row"><select id="model"><option>gemini-2.5-flash</option><option>gemini-2.5-pro</option><option>gemini-2.0-flash</option><option>gemini-1.5-flash</option></select><button onclick="testKey()">Test Connection</button><button class="ghost" onclick="toggleKey()">Show/Hide</button></div>
<div id="testResult"></div></div>

<div class="card"><h3 style="margin:0">2. Mode + Controls</h3>
<div id="modes" style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"></div>
<div id="chips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
<div class="row"><div><label>Temperature / Creativity: <b id="tempVal">0.7</b></label><input id="temp" type="range" min="0" max="2" step="0.1" value="0.7"></div><div><label>Max Tokens: <b id="tokVal">2048</b></label><input id="toks" type="range" min="256" max="8192" step="256" value="2048"></div></div>
<div class="row"><input id="memName" placeholder="Your name (memory)"><input id="memStyle" placeholder="Style: e.g. Hinglish, funny, simple"></div>
<small>Memory is auto-added to every prompt.</small></div>

<div class="card"><h3 style="margin:0">3. Chat</h3><div id="chat"></div>
<textarea id="prompt" rows="3" placeholder="Ask anything... e.g. Make flashcards for photosynthesis"></textarea>
<div class="row"><button onclick="send()">Send to Gemini →</button><button class="ghost" onclick="clearChat()">Clear Chat</button></div>
<div><small>Tip: Open this file in Chrome, not inside Meta AI preview. Preview blocks Google API.</small></div></div>
</div>
<script>
const modes={Chat:{sys:"You are a helpful assistant.",chips:["Explain like I'm 5","Roast my idea","Debate me","Give me a plan"]},Study:{sys:"You are a study tutor. Give clear notes, examples, flashcards and quiz.",chips:["Make flashcards","Make quiz","Summarize notes","Explain like I'm 5"]},Code:{sys:"You are a senior coder. Give clean code, explain bugs, give fixed code.",chips:["Fix this bug","Explain this code","Convert to Python","Write tests"]},Content:{sys:"You are a viral content writer. Give catchy, ready-to-post content.",chips:["YouTube titles","Instagram caption","Resume bullets","Cold email"]},Planner:{sys:"You are a planner. Make realistic timetables and to-do lists.",chips:["Make timetable","Study plan 10 days","Morning routine"]},Translate:{sys:"You are a translator. Keep tone natural.",chips:["Translate to Hinglish","Translate to Hindi","Translate to English"]}};
let curMode='Chat';
function renderModes(){document.getElementById('modes').innerHTML=Object.keys(modes).map(m=>`<div class="pill ${m===curMode?'active':''}" onclick="setMode('${m}')">${m}</div>`).join('');renderChips();}
function setMode(m){curMode=m;renderModes();}
function renderChips(){document.getElementById('chips').innerHTML=modes[curMode].chips.map(c=>`<span class="chip" onclick="useChip('${c}')">${c}</span>`).join('');}
function useChip(c){document.getElementById('prompt').value=c+": ";document.getElementById('prompt').focus();}
function save(){localStorage.setItem('gh_key',document.getElementById('apiKey').value);localStorage.setItem('gh_model',document.getElementById('model').value);localStorage.setItem('gh_mem',JSON.stringify({name:document.getElementById('memName').value,style:document.getElementById('memStyle').value}));localStorage.setItem('gh_chat',document.getElementById('chat').innerHTML);}
function load(){document.getElementById('apiKey').value=localStorage.getItem('gh_key')||'';document.getElementById('model').value=localStorage.getItem('gh_model')||'gemini-2.5-flash';try{let m=JSON.parse(localStorage.getItem('gh_mem')||'{}');document.getElementById('memName').value=m.name||'';document.getElementById('memStyle').value=m.style||'';}catch(e){}document.getElementById('chat').innerHTML=localStorage.getItem('gh_chat')||'';updateBadge();}
function updateBadge(){let k=document.getElementById('apiKey').value.trim();document.getElementById('keyBadge').textContent=k.startsWith('AQ.')?'✅ New Auth Key Detected':k.startsWith('AIza')?'Legacy Key':k?'Key entered':'No key';}
function toggleKey(){let e=document.getElementById('apiKey');e.type=e.type==='password'?'text':'password';}
async function testKey(){let k=document.getElementById('apiKey').value.trim();updateBadge();save();let el=document.getElementById('testResult');el.innerHTML='Testing...';try{let r=await fetch('https://generativelanguage.googleapis.com/v1beta/models',{headers:{'x-goog-api-key':k}});let t=await r.text();el.innerHTML=r.ok?'✅ <b>Connected! Your AQ key works.</b> Found '+(JSON.parse(t).models?.length||0)+' models.':'❌ Failed '+r.status+'<pre>'+t.slice(0,600)+'</pre>';}catch(e){el.innerHTML='❌ Blocked: '+e.message+'<br>Are you opening this inside a preview? Open in Chrome.';}}
async function send(){let k=document.getElementById('apiKey').value.trim();if(!k){alert('Paste your API key first');return;}let q=document.getElementById('prompt').value.trim();if(!q)return;let model=document.getElementById('model').value;save();updateBadge();
let mem=`User name: ${document.getElementById('memName').value}. Preferred style: ${document.getElementById('memStyle').value}.`;
let chat=document.getElementById('chat');chat.innerHTML+=`<div class="msg user">${q.replace(/</g,'&lt;')}</div><div class="msg ai" id="loading">Thinking...</div>`;document.getElementById('prompt').value='';save();
try{let r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify({systemInstruction:{parts:[{text:modes[curMode].sys+' Memory: '+mem}]},contents:[{parts:[{text:q}]}],generationConfig:{temperature:parseFloat(document.getElementById('temp').value),maxOutputTokens:parseInt(document.getElementById('toks').value)}})});let d=await r.json();let ans=d.candidates?.[0]?.content?.parts?.map(p=>p.text).join('')||('Error: '+JSON.stringify(d).slice(0,800));document.getElementById('loading').textContent=ans;document.getElementById('loading').id='';}catch(e){document.getElementById('loading').textContent='Blocked: '+e.message+' - Open this file in Chrome, not in preview.';}save();}
function clearChat(){document.getElementById('chat').innerHTML='';save();}
document.getElementById('temp').oninput=e=>document.getElementById('tempVal').textContent=e.target.value;
document.getElementById('toks').oninput=e=>document.getElementById('tokVal').textContent=e.target.value;
document.getElementById('apiKey').oninput=()=>{updateBadge();save();};
renderModes();load();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
