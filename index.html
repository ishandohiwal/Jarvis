:root{
  --bg:#000000;
  --surface:#0a0a0a;
  --surface-2:#111111;
  --surface-3:#171717;
  --line:rgba(255,255,255,.09);
  --text:#f5f5f5;
  --muted:#a1a1aa;
  --violet:#8b5cf6;
  --cyan:#22d3ee;
  --pink:#ec4899;
  --safe-area-inset-top:0px;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#000;
    --surface:#0a0a0a;
    --text:#f5f5f5;
  }
}

*{
  box-sizing:border-box;
}

html,body{
  background:var(--bg);
  color:var(--text);
  font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;
}

.font-display{
  font-family:'Space Grotesk',system-ui,sans-serif;
}

.glass{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(18px);
}

.grad-text{
  background:linear-gradient(90deg,#a78bfa,#22d3ee,#f472b6);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.grad-bg{
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
}

.grad-bg-soft{
  background:linear-gradient(135deg,rgba(124,58,237,.28),rgba(6,182,212,.22));
}

.grad-border{
  border:1px solid transparent;
  background:linear-gradient(#0a0a0a,#0a0a0a) padding-box, linear-gradient(135deg,#8b5cf6,#22d3ee) border-box;
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}

.no-scrollbar{
  scrollbar-width:none;
}

::-webkit-scrollbar{
  width:6px;
  height:6px;
}

::-webkit-scrollbar-thumb{
  background:#2a2a2a;
  border-radius:99px;
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-6px)
  }
}

@keyframes pulse-dot{
  0%,80%,100%{
    opacity:.25;
    transform:scale(.8)
  }

  40%{
    opacity:1;
    transform:scale(1)
  }
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(8px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes shimmer{
  0%{
    background-position:-200% 0
  }

  100%{
    background-position:200% 0
  }
}

.anim-fade{
  animation:fadeUp .35s ease both;
}

.typing-dot{
  width:7px;
  height:7px;
  border-radius:99px;
  background:#a78bfa;
  animation:pulse-dot 1.1s infinite;
}

.typing-dot:nth-child(2){
  animation-delay:.15s;
  background:#22d3ee;
}

.typing-dot:nth-child(3){
  animation-delay:.3s;
  background:#f472b6;
}

input[type=range]{
  -webkit-appearance:none;
  -moz-appearance:none;
       appearance:none;
  height:6px;
  border-radius:99px;
  background:#262626;
  outline:none;
}

input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:18px;
  height:18px;
  border-radius:99px;
  background:linear-gradient(135deg,#8b5cf6,#22d3ee);
  border:2px solid #000;
  cursor:pointer;
  box-shadow:0 0 0 3px rgba(139,92,246,.25);
}

.inp{
  width:100%;
  border-radius:12px;
  background:#111;
  border:1px solid rgba(255,255,255,.1);
  padding:10px 12px;
  font-size:13.5px;
  outline:none;
  color:#fff;
}

.inp:focus{
  border-color:rgba(139,92,246,.7);
}

.inp::-moz-placeholder{
  color:#71717a;
}

.inp::placeholder{
  color:#71717a;
}

.markdown p{
  margin:0 0 10px;
  line-height:1.65;
}

.markdown h3{
  font-size:17px;
  font-weight:700;
  margin:12px 0 6px;
}

.markdown ul{
  list-style:disc;
  padding-left:18px;
  margin:0 0 10px;
}

.markdown li{
  margin:4px 0;
  line-height:1.6;
}

.markdown strong{
  color:#fff;
}

.placeholder\:text-zinc-500::-moz-placeholder{
  --tw-text-opacity: 1;
  color: rgb(113 113 122 / var(--tw-text-opacity, 1));
}

.placeholder\:text-zinc-500::placeholder{
  --tw-text-opacity: 1;
  color: rgb(113 113 122 / var(--tw-text-opacity, 1));
}

.focus-within\:border-violet-500\/60:focus-within{
  border-color: rgb(139 92 246 / 0.6);
}

.hover\:border-violet-400\/40:hover{
  border-color: rgb(167 139 250 / 0.4);
}

.hover\:border-violet-400\/50:hover{
  border-color: rgb(167 139 250 / 0.5);
}

.hover\:bg-violet-500\/10:hover{
  background-color: rgb(139 92 246 / 0.1);
}

.hover\:bg-white\/\[\.05\]:hover{
  background-color: rgb(255 255 255 / .05);
}

.hover\:bg-white\/\[\.08\]:hover{
  background-color: rgb(255 255 255 / .08);
}

.hover\:text-red-300:hover{
  --tw-text-opacity: 1;
  color: rgb(252 165 165 / var(--tw-text-opacity, 1));
}

.disabled\:opacity-40:disabled{
  opacity: 0.4;
}

.group:hover .group-hover\:flex{
  display: flex;
}

@media (min-width: 640px){
  .sm\:inline{
    display: inline;
  }

  .sm\:flex{
    display: flex;
  }

  .sm\:h-\[60vh\]{
    height: 60vh;
  }

  .sm\:max-w-\[78\%\]{
    max-width: 78%;
  }

  .sm\:max-w-\[86\%\]{
    max-width: 86%;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:items-center{
    align-items: center;
  }

  .sm\:gap-2{
    gap: 0.5rem;
  }

  .sm\:gap-3{
    gap: 0.75rem;
  }

  .sm\:px-4{
    padding-left: 1rem;
    padding-right: 1rem;
  }

  .sm\:px-5{
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:text-\[11px\]{
    font-size: 11px;
  }

  .sm\:text-\[32px\]{
    font-size: 32px;
  }

  .sm\:text-lg{
    font-size: 1.125rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 768px){
  .md\:bottom-6{
    bottom: 1.5rem;
  }

  .md\:flex{
    display: flex;
  }

  .md\:hidden{
    display: none;
  }
}

@media (min-width: 1024px){
  .lg\:flex{
    display: flex;
  }
}
