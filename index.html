elative}.eyebrow{color:#c79bff;font-size:10px;letter-spacing:2px;font-weight:700}.hero h1{font:700 clamp(28px,4vw,44px) 'Space Grotesk';margin:12px 0}.hero p{color:#aaa3b4;line-height:1.6;max-width:560px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,#8d5ce5,#c17fd6);color:white}.secondary{background:#211b2a;border:1px solid #403349;color:#d9c6f1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:17px 0}.stat,.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}.stat small{color:var(--muted);font-size:10px}.stat b{display:block;font:700 24px 'Space Grotesk';margin-top:8px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:23px 0 12px}.head h2{font-size:16px;margin:0}.head p{color:var(--muted);font-size:12px;margin:5px 0 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:var(--panel);border:1px solid var(--border);border-radius:15px;overflow:hidden;transition:.18s}.card:hover{transform:translateY(-3px);border-color:#65517d}.art{height:185px;position:relative;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2))}.art:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:#ffffff14;top:-50px;right:-30px}.art .symbol{font:700 76px 'Space Grotesk';color:#ffffff35;text-shadow:0 8px 30px #0003}.art img{width:100%;height:100%;object-fit:cover;position:absolute}.tier{position:absolute;top:9px;left:9px;background:#08080dcc;border:1px solid #ffffff25;border-radius:7px;padding:5px 7px;font-size:10px;font-weight:800}.heart{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:1px solid #ffffff30;background:#09090dbb;color:white;cursor:pointer}.heart.on{color:#ff8bc5}.info{padding:12px}.info h3{font-size:13px;margin:0}.source{font-size:10px;color:var(--muted);margin:5px 0 11px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.price{font-size:11px;color:var(--gold);font-weight:700}.buy{background:#211a2a;border:1px solid #453653;color:#d8c1f1;border-radius:7px;padding:7px 9px;font-size:10px;font-weight:800;cursor:pointer}.owned{color:var(--green);font-size:10px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.controls input,.controls select{background:#14131a;border:1px solid var(--border);border-radius:9px;padding:10px;color:var(--text)}.controls input{flex:1;min-width:160px}.quest{display:flex;align-items:center;gap:12px;padding:12px;background:#14131a;border:1px solid var(--border);border-radius:11px;margin:8px 0}.quest .qicon{font-size:21px}.qinfo{flex:1}.qinfo b{font-size:12px}.qinfo small{display:block;color:var(--muted);margin-top:4px}.reward{color:var(--gold);font-size:11px;font-weight:700}.quest button{border:0;border-radius:7px;padding:8px 10px;background:#332343;color:#d8b6ff;font-size:10px;font-weight:700;cursor:pointer}.quest button:disabled{background:#222;color:#777}.empty{text-align:center;border:1px dashed #35313e;border-radius:14px;padding:38px;color:var(--muted)}.rollbox{text-align:center;padding:32px 16px;border:1px solid #382447;border-radius:18px;background:radial-gradient(circle at center,#261735,transparent 70%),#101017}.orb{width:145px;height:145px;border-radius:50%;margin:15px auto;display:grid;place-items:center;background:radial-gradient(circle,#c8a0ff,#7541ad 55%,#21132e);box-shadow:0 0 45px #9a5ae955;font-size:52px}.orb.spin{animation:spin .7s linear infinite,glow .4s alternate infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes glow{to{box-shadow:0 0 70px #d58bff}}.result{max-width:350px;margin:20px auto}.result .art{height:240px;border-radius:12px}.progress{height:6px;background:#28232f;border-radius:8px;overflow:hidden;margin-top:7px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#8f61d4,#e0a6dc)}.history{display:flex;gap:12px;align-items:center;padding:10px;border-bottom:1px solid var(--border)}.mini{width:42px;height:48px;border-radius:8px;background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;place-items:center;color:#ffffff88;font-weight:800}.history div:nth-child(2){flex:1}.history small{display:block;color:var(--muted);margin-top:3px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#211b2b;border:1px solid #554269;padding:11px 17px;border-radius:10px;z-index:20;color:#e6d5ff;font-size:12px}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:25;padding:15px}.modal.hidden{display:none}.modalbox{background:#14121a;border:1px solid #42344e;border-radius:17px;padding:22px;width:min(420px,100%);text-align:center}.foot{color:#666270;font-size:10px;margin-top:20px}.mobile{display:none}

</style></head><body>
<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">✦</div><div><b>WAIFU SWAP</b><small>ASTRAL COLLECTION</small></div></div><nav class="nav" id="nav"><button class="active" data-view="dashboard">⌂ Dashboard</button><button data-view="market">▦ Market</button><button data-view="roll">✧ Daily Summon</button><button data-view="wishlist">♡ Wishlist <span id="wishCount">0</span></button><button data-view="collection">◈ Collection</button><button data-view="quests">☰ Quests</button><button data-view="history">↻ Roll History</button><button data-view="rankings">♜ Rankings</button></nav><div class="bottom">Local prototype · Browser save<br><button id="reset" style="background:none;border:0;color:#817b8c;margin-top:8px;cursor:pointer">↺ Reset save</button></div></aside>
<main class="main"><header class="top"><div><button class="mobile" id="menu">☰</button><small>ASTRAL ARCHIVE</small><strong id="title">Dashboard</strong></div><div class="wallet">✦ <b id="coins">500</b> <small>AC</small></div></header><div class="content" id="content"></div></main></div><div class="toast" id="toast"></div><div class="modal hidden" id="modal"></div>
<script>
const tiers='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');const prices=[100,200,350,500,750,1000,1500,2000,2500,3000,4000,5000,6500,8000,10000,12000,15000,20000,25000,35000,50000,75000,100000,150000,250000,500000];const palette={A:['#303846','#66758a'],B:['#263a4b','#527c9b'],C:['#234449','#55978f'],D:['#34482d','#7eaa64'],E:['#4b3828','#a98a5e'],F:['#4c2e34','#b36a78'],G:['#432d4c','#a26bb7'],H:['#302d57','#8277d8'],I:['#26365e','#5b90d5'],J:['#43344f','#ba84cb'],K:['#533d31','#d0a06c'],L:['#4c3b26','#d4bc78'],M:['#3b334d','#b19acb'],N:['#342c49','#a68ae0'],O:['#473047','#d28cc0'],P:['#3a294b','#be8ce6'],Q:['#33254d','#9e8af1'],R:['#43243f','#d77bc5'],S:['#402c4d','#dc9bd8'],T:['#463423','#e2bf77'],U:['#382d4b','#c0a4ee'],V:['#3a254b','#d28aff'],W:['#39263d','#e0a0c9'],X:['#2c234b','#b7a1ff'],Y:['#432343','#f0a6dc'],Z:['#24122f','#d8a2ff']};
const chars=[['Kaoruko Waguri','The Fragrant Flower Blooms with Dignity','Z','K'],['Marin Kitagawa','My Dress-Up Darling','S','M'],['Yor Forger','SPY x FAMILY','R','Y'],['Rem','Re:Zero','Q','R'],['Rias Gremory','High School DxD','P','R'],['Violet Evergarden','Violet Evergarden','O','V'],['Miku Nakano','The Quintessential Quintuplets','N','M'],['Hori Kyouko','Horimiya','M','H'],['Asuna Yuuki','Sword Art Online','L','A'],['Zero Two','DARLING in the FRANXX','K','0'],['Nezuko Kamado','Demon Slayer','J','N'],['Shinobu Kocho','Demon Slayer','I','S'],['Chisato Nishikigi','Lycoris Recoil','H','C'],['Alya','Alya Sometimes Hides Her Feelings in Russian','G','A'],['Akane Kurokawa','Oshi no Ko','F','A'],['Lucy','Cyberpunk: Edgerunners','E','L'],['Nami','One Piece','D','N'],['Nobara Kugisaki','Jujutsu Kaisen','C','N'],['Anya Forger','SPY x FAMILY','B','A'],['Sakura Haruno','Naruto','A','S'],['Kaguya Shinomiya','Kaguya-sama: Love is War','T','K'],['Frieren','Frieren: Beyond Journey’s End','U','F'],['Makima','Chainsaw Man','V','M'],['Furina','Genshin Impact','W','F'],['Holo','Spice and Wolf','X','H'],['Emilia','Re:Zero','Y','E']].map((x,i)=>({id:i+1,name:x[0],anime:x[1],tier:x[2],symbol:x[3],price:prices[tiers.indexOf(x[2])],colors:palette[x[2]],image:''}));
const defaults={coins:500,owned:[],wishlist:[],rolls:[],quests:{},lastLogin:null,streak:0,pity:0,showcase:[],views:0,firstPurchase:false};let s;try{s={...defaults,...JSON.parse(localStorage.getItem('waifuSwapSave')||'{}')}}catch{s={...defaults}};let view='dashboard';const $=q=>document.querySelector(q);const fmt=n=>Number(n).toLocaleString();const today=()=>new Date().toISOString().slice(0,10);const c=id=>chars.find(x=>x.id===id);const own=id=>s.owned.includes(id);function save(){localStorage.setItem('waifuSwapSave',JSON.stringify(s));header()}function header(){$('#coins').textContent=fmt(s.coins);$('#wishCount').textContent=s.wishlist.length}function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2300)}function art(x){return `<div class="art" style="--c1:${x.colors[0]};--c2:${x.colors[1]}"><span class="symbol">${x.symbol}</span>${x.image?`<img src="${esc(x.image)}" onerror="this.remove()">`:''}</div>`}function esc(t){return String(t).replace(/[&<>"']/g,z=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[z]))}function card(x){return `<article class="card">${art(x)}<span class="tier">${x.tier} · ${x.tier==='Z'?'SUPREME':'TIER '+x.tier}</span><button class="heart ${s.wishlist.includes(x.id)?'on':''}" data-wish="${x.id}">${s.wishlist.includes(x.id)?'♥':'♡'}</button><div class="info"><h3>${esc(x.name)}</h3><div class="source">${esc(x.anime)}</div><div class="row"><span class="price">✦ ${fmt(x.price)} AC</span>${own(x.id)?'<span class="owned">✓ OWNED</span>':`<button class="buy" data-buy="${x.id}">RECRUIT</button>`}</div></div></article>`}function nav(v){view=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#title').textContent=({dashboard:'Dashboard',market:'Market',roll:'Daily Summon',wishlist:'Wishlist',collection:'Collection',quests:'Quests',history:'Roll History',rankings:'Rankings'})[v];$('#sidebar').classList.remove('open');render()}
const qs=[['visit','🔭','Explorer','Visit the character market',50],['views','📖','Character Explorer','View 5 characters',75],['roll','🎲','Daily Summon','Perform today’s free summon',100],['purchase','🛒','First Recruitment','Recruit a character',100],['collector','💎','Collector’s Pride','Own 3 characters',150],['wishlist','♡','Dream Board','Wishlist 3 characters',75]];function qdone(id){return id==='visit'?s.quests.visit===today():id==='views'?(s.quests.views||0)>=5:id==='roll'?s.rolls.some(r=>r.date===today()):id==='purchase'?s.owned.length>0:id==='collector'?s.owned.length>=3:id==='wishlist'?s.wishlist.length>=3:false}function qclaimed(id){return s.quests['claim_'+id]===today()}function qlist(short=false){return qs.slice(0,short?4:6).map(q=>`<div class="quest"><div class="qicon">${q[1]}</div><div class="qinfo"><b>${q[2]}</b><small>${q[3]}</small></div><span class="reward">+${q[4]} AC</span><button data-claim="${q[0]}" ${!qdone(q[0])||qclaimed(q[0])?'disabled':''}>${qclaimed(q[0])?'CLAIMED':qdone(q[0])?'CLAIM':'IN PROGRESS'}</button></div>`).join('')}
function dashboard(){return `<section class="hero"><div class="eyebrow">COLLECT · DISCOVER · RECRUIT</div><h1>Your anime universe awaits.</h1><p>Build your dream collection across the multiverse. Complete quests, summon characters, and save up for the ones you truly want.</p><div class="actions"><button class="btn primary" data-goto="roll">✧ Daily Summon</button><button class="btn secondary" data-goto="market">Explore Market →</button></div></section><div class="stats"><div class="stat"><small>ASTRAL COINS</small><b>✦ ${fmt(s.coins)}</b></div><div class="stat"><small>COLLECTION</small><b>${s.owned.length} / ${chars.length}</b></div><div class="stat"><small>DAILY STREAK</small><b>🔥 ${s.streak}</b></div><div class="stat"><small>WISHLIST</small><b>♡ ${s.wishlist.length}</b></div></div><div class="head"><div><h2>Featured Character</h2><p>Today's spotlight from the archive</p></div><button class="btn secondary" data-goto="market">View Market</button></div><div class="grid">${card(chars[0])}</div><div class="head"><div><h2>Quick Quests</h2><p>Complete tasks and earn Astral Coins</p></div><button class="btn secondary" data-goto="quests">All Quests →</button></div>${qlist(true)}<p class="foot">Prototype save is stored in this browser. Add image URLs to character data to replace placeholder art.</p>`}
function market(){return `<div class="head"><div><h2>Character Market</h2><p>${chars.length} characters currently available</p></div></div><div class="controls"><input id="search" placeholder="Search character or anime…"><select id="tier"><option value="">All tiers</option>${tiers.map(t=>`<option>${t}</option>`).join('')}</select><select id="sort"><option value="tier">Tier: highest first</option><option value="price">Price: low to high</option><option value="name">Name: A-Z</option></select></div><div class="grid" id="grid">${chars.slice().sort((a,b)=>tiers.indexOf(b.tier)-tiers.indexOf(a.tier)).map(card).join('')}</div>`}
function wishlist(){return s.wishlist.length?`<div class="head"><div><h2>Dream Recruits</h2><p>Characters you want to collect</p></div></div><div class="grid">${s.wishlist.map(id=>c(id)).filter(Boolean).map(x=>`<div>${card(x)}<div style="font-size:10px;color:var(--muted);padding:7px">${Math.min(100,Math.floor(s.coins/x.price*100))}% saved · ${fmt(Math.max(0,x.price-s.coins))} AC remaining<div class="progress"><span style="width:${Math.min(100,s.coins/x.price*100)}%"></span></div></div></div>`).join('')}</div>`:`<div class="empty"><div style="font-size:38px">♡</div><h2>Your wishlist is empty</h2><p>Heart characters in the market to track your dream recruits.</p><button class="btn primary" data-goto="market">Explore Market</button></div>`}
function collection(){return s.owned.length?`<div class="head"><div><h2>Your Collection</h2><p>${s.owned.length} / ${chars.length} characters · ${Math.floor(s.owned.length/chars.length*100)}% complete</p></div></div><div class="controls"><input id="search" placeholder="Search collection…"><select id="tier"><option value="">All tiers</option>${tiers.map(t=>`<option>${t}</option>`).join('')}</select></div><div class="grid" id="grid">${s.owned.map(c).filter(Boolean).map(card).join('')}</div><div class="panel" style="margin-top:18px"><h3>Character Showcase</h3><p style="color:var(--muted);font-size:12px">Pin up to five owned characters.</p><div class="controls"><select id="showselect"><option value="">Select character</option>${s.owned.map(c).filter(Boolean).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><button class="btn secondary" id="pin">Pin to Showcase</button></div><div class="grid">${s.showcase.map(c).filter(Boolean).map(card).join('')}</div></div>`:`<div class="empty"><h2>Your collection begins here</h2><p>Recruit a character from the market or daily summon.</p><button class="btn primary" data-goto="market">Open Market</button></div>`}
function quests(){return `<div class="head"><div><h2>Quest Board</h2><p>Complete objectives and claim Astral Coins</p></div></div>${qlist()}<div class="panel"><h3>Streak Rewards</h3><p style="color:var(--muted);font-size:12px">Daily login: 100 AC · Every 7-day streak: +250 AC bonus. Current streak: ${s.streak} day(s).</p></div>`}
function history(){return s.rolls.length?`<div class="head"><div><h2>Summon History</h2><p>Your past daily rolls</p></div></div><div class="panel">${s.rolls.slice().reverse().map(r=>{let x=c(r.id);return `<div class="history"><div class="mini" style="--c1:${x.colors[0]};--c2:${x.colors[1]}">${x.symbol}</div><div><b>${esc(x.name)}</b><small>${r.date} · Tier ${x.tier}</small></div><span class="price">${x.tier}</span></div>`}).join('')}</div>`:`<div class="empty"><h2>No summons yet</h2><button class="btn primary" data-goto="roll">Summon Now</button></div>`}
function rankings(){return `<div class="head"><div><h2>Market Rankings</h2><p>Highest-value characters in the archive</p></div></div><div class="panel">${chars.slice().sort((a,b)=>b.price-a.price).map((x,i)=>`<div class="history"><div class="mini" style="--c1:${x.colors[0]};--c2:${x.colors[1]}">${i+1}</div><div><b>${esc(x.name)}</b><small>${esc(x.anime)}</small></div><span class="price">${x.tier} · ${fmt(x.price)} AC</span></div>`).join('')}</div>`}
function roll(){return `<div class="rollbox"><div class="eyebrow">ASTRAL SUMMONING PORTAL</div><h1>Daily Summon</h1><p style="color:var(--muted)">One free roll per day. Higher tiers are extraordinarily rare.</p><div class="orb" id="orb">✦</div><button class="btn primary" id="rollbtn" ${s.rolls.some(r=>r.date===today())?'disabled':''}>${s.rolls.some(r=>r.date===today())?'ROLL USED TODAY':'🎲 SUMMON CHARACTER'}</button><p style="color:var(--muted);font-size:12px">Pity counter: ${s.pity} / 100 toward S-tier guarantee</p><div id="result"></div></div><div class="panel" style="margin-top:17px"><h3>Summon Rates</h3><p style="color:var(--muted);font-size:12px">Free daily roll only. No paid rolls. Z tier is extremely rare. Rate values are prototype balancing.</p><div class="controls"><select id="ratefilter"><option value="">All tiers</option>${tiers.map(t=>`<option>${t}</option>`).join('')}</select></div><div id="rates" class="grid"></div></div>`}
function render(){let el=$('#content');el.innerHTML=({dashboard,market,roll,wishlist,collection,quests,history,rankings})[view]();bind();if(view==='roll')rateRender()}
function bind(){document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>nav(b.dataset.goto));document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(+b.dataset.buy));document.querySelectorAll('[data-wish]').forEach(b=>b.onclick=()=>wish(+b.dataset.wish));document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>claim(b.dataset.claim));let search=$('#search'),tier=$('#tier'),sort=$('#sort');if(search||tier||sort){let filter=()=>{let pool=view==='collection'?s.owned.map(c).filter(Boolean):chars;pool=pool.filter(x=>(!search||`${x.name} ${x.anime}`.toLowerCase().includes(search.value.toLowerCase()))&&(!tier||!tier.value||x.tier===tier.value));if(sort?.value==='price')pool.sort((a,b)=>a.price-b.price);else if(sort?.value==='name')pool.sort((a,b)=>a.name.localeCompare(b.name));else pool.sort((a,b)=>tiers.indexOf(b.tier)-tiers.indexOf(a.tier));$('#grid').innerHTML=pool.map(card).join('');bindCards()};search?.addEventListener('input',filter);tier?.addEventListener('change',filter);sort?.addEventListener('change',filter)}$('#rollbtn')?.addEventListener('click',doRoll);$('#pin')?.addEventListener('click',()=>{let id=+$('#showselect').value;if(!id)return toast('Choose a character first');if(s.showcase.includes(id))return toast('Already pinned');if(s.showcase.length>=5)return toast('Showcase limit is 5');s.showcase.push(id);save();render();toast('Pinned to showcase ✦')});$('#ratefilter')?.addEventListener('change',rateRender);bindCards()}
function bindCards(){document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(+b.dataset.buy));document.querySelectorAll('[data-wish]').forEach(b=>b.onclick=()=>wish(+b.dataset.wish))}
function buy(id){let x=c(id);if(own(id))return toast('Already in collection');if(s.coins<x.price)return toast(`Need ${fmt(x.price-s.coins)} more AC`);s.coins-=x.price;s.owned.push(id);if(!s.firstPurchase){s.coins+=100;s.firstPurchase=true;toast('Recruitment complete! +100 first purchase bonus')}else toast(`${x.name} recruited!`);save();render()}
function wish(id){s.wishlist=s.wishlist.includes(id)?s.wishlist.filter(x=>x!==id):[...s.wishlist,id];save();render()}
function claim(id){if(!qdone(id)||qclaimed(id))return;let q=qs.find(x=>x[0]===id);s.quests['claim_'+id]=today();s.coins+=q[4];save();render();toast(`Quest claimed: +${q[4]} AC`)}
function doRoll(){if(s.rolls.some(r=>r.date===today()))return toast('Free summon already used today');let btn=$('#rollbtn'),orb=$('#orb');btn.disabled=true;btn.textContent='SUMMONING…';orb.classList.add('spin');setTimeout(()=>{let x=rollCharacter();s.rolls.push({id:x.id,date:today()});s.pity++;s.quests.roll=today();if(!own(x.id))s.owned.push(x.id);else s.coins+=Math.max(50,Math.floor(x.price*.03));save();orb.classList.remove('spin');$('#result').innerHTML=`<div class="result">${art(x)}<h2>${esc(x.name)}</h2><p>${esc(x.anime)} · Tier ${x.tier}</p><b class="price">${fmt(x.price)} AC</b></div>`;renderHeader();rateRender();toast(own(x.id)?'Duplicate converted into bonus coins!':`${x.name} joined your collection!`)},1300)}
function rollCharacter(){let weights=tiers.map((t,i)=>Math.pow(.72,i));if(s.pity>=99){let candidates=chars.filter(x=>tiers.indexOf(x.tier)>=tiers.indexOf('S'));return candidates[Math.floor(Math.random()*candidates.length)]}let total=weights.reduce((a,b)=>a+b,0),r=Math.random()*total,idx=0;for(;idx<weights.length;idx++){r-=weights[idx];if(r<=0)break}let tier=tiers[Math.min(idx,25)];let pool=chars.filter(x=>x.tier===tier);if(!pool.length)pool=chars.filter(x=>tiers.indexOf(x.tier)<=tiers.indexOf(tier));return pool[Math.floor(Math.random()*pool.length)]}
function rateRender(){let f=$('#ratefilter')?.value||'';let rate=$('#rates');if(!rate)return;rate.innerHTML=tiers.filter(t=>!f||t===f).map(t=>`<div class="stat"><small>TIER ${t}</small><b>${(Math.pow(.72,tiers.indexOf(t))*100).toFixed(3)}%</b></div>`).join('')}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(b)nav(b.dataset.view)});$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');$('#reset').onclick=()=>{if(confirm('Reset all Waifu Swap progress in this browser?')){localStorage.removeItem('waifuSwapSave');location.reload()}};
// Daily login reward and streak update
if(s.lastLogin!==today()){let yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);s.streak=s.lastLogin===yesterday?s.streak+1:1;s.lastLogin=today();s.coins+=100;if(s.streak%7===0)s.coins+=250;save();setTimeout(()=>toast(`Daily login: +100 AC${s.streak%7===0?' +250 streak bonus':''}`),600)}
nav('dashboard');header();

// REAL CHARACTER ART: fetch character portraits from Jikan (MyAnimeList data API).
// Images are cached in this browser so they do not need to be fetched again.
async function loadCharacterArt(){
  const cacheKey='waifuSwapArtCache'; let cache={}; try{cache=JSON.parse(localStorage.getItem(cacheKey)||'{}')}catch{}
  for(const x of chars){
    if(cache[x.name]){x.image=cache[x.name];continue}
  }
  if(view==='dashboard')render();
  const missing=chars.filter(x=>!x.image);
  for(let i=0;i<missing.length;i++){
    const x=missing[i];
    try{
      const res=await fetch('https://api.jikan.moe/v4/characters?q='+encodeURIComponent(x.name)+'&limit=5');
      if(res.ok){const data=await res.json();const match=(data.data||[]).find(v=>v.name.toLowerCase()===x.name.toLowerCase())||(data.data||[])[0];
        const url=match?.images?.webp?.image_url||match?.images?.jpg?.image_url;
        if(url){x.image=url;cache[x.name]=url;localStorage.setItem(cacheKey,JSON.stringify(cache));if(view==='dashboard'||view==='market'||view==='collection'||view==='wishlist')render();}
      }
    }catch(e){console.warn('Character art lookup failed for '+x.name,e)}
    // Jikan rate limit courtesy delay
    await new Promise(resolve=>setTimeout(resolve,1100));
  }
}
loadCharacterArt();
</script></body></html>
