<!DOCTYPE html><html lang="en"><head><style>

</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemini Hub v3 - Fixed</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Inter,system-ui,sans-serif}
#app{display:flex;height:100vh}#side{width:280px;background:#0a0a0a;border-right:1px solid #222;display:flex;flex-direction:column}
#side h2{padding:16px;margin:0;font-size:20px}#side h2 span{background:linear-gradient(90deg,#8b5cf6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{background:linear-gradient(90deg,#8b5cf6,#06b6d4);border:none;color:#fff;padding:11px 14px;border-radius:12px;font-weight:700;cursor:pointer;width:100%}
.ghost{background:#1a1a1a;border:1px solid #333}
input,select,textarea{width:100%;background:#111;border:1px solid #333;color:#fff;border-radius:12px;padding:11px;margin:6px 0;outline:none}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{padding:12px 16px;border-bottom:1px solid #222;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{padding:7px 13px;border-radius:999px;background:#151515;border:1px solid #333;cursor:pointer;font-size:13px}.pill.on{background:#8b5cf6}
#chat{flex:1;overflow:auto;padding:16px}.msg{padding:12px 14px;border-radius:16px;margin:10px 0;white-space:pre-wrap;line-height:1.6;max-width:85%}.user{background:#2e1065;margin-left:auto}.ai{background:#111;border:1px solid #222}
#inputArea{padding:12px;border-top:1px solid #222}#chats{flex:1;overflow:auto;padding:0 10px}.chatItem{padding:10px;border-radius:12px;cursor:pointer;border:1px solid transparent}.chatItem:hover,.chatItem.active{background:#1a1a1a;border-color:#333}
small{color:#888}label{font-size:12px;color:#aaa}
#drawer{display:none;position:fixed;right:0;top:0;bottom:0;width:340px;max-width:90vw;background:#0a0a0a;border-left:1px solid #333;padding:16px;overflow:auto;z-index:20}
#drawer.open{display:block}.row{display:flex;gap:8px}.row>*{flex:1}
@media(max-width:768px){#side{display:none}#side.open{display:flex;position:fixed;z-index:30;height:100vh}}
#err{background:#3b0000;border:1px solid #ff5555;padding:10px;border-radius:12px;display:none;white-space:pre-wrap}
</style></head><body>
<div id="app">
<div id="side"><h2>Gemini <span>Hub</span></h2><div style="padding:0 12px"><button class="btn" onclick="newChat()">+ New Chat</button></div><div style="padding:10px"><input id="search" placeholder="Search chats..." oninput="renderChats()"></div><div id="chats"></div><div style="padding:12px"><button class="btn ghost" onclick="toggleDrawer()">⚙ Customize Gemini</button><button class="btn ghost" style="margin-top:8px" onclick="toggleSide()">Close Sidebar</button></div></div>
<div id="main">
<div id="top"><button class="btn ghost" style="width:auto" onclick="toggleSide()">☰</button><select id="model" style="width:200px"><option>gemini-3.8-flash</option><option>gemini-3-flash</option><option>gemini-3-pro</option></select><button class="btn" style="width:auto" onclick="testKey()">Test Connection</button><button class="btn ghost" style="width:auto" onclick="toggleDrawer()">Customize</button><span id="badge" style="font-size:12px">No key</span></div>
<div id="err"></div>
<div style="padding:10px 16px 0"><input id="apiKey" type="password" placeholder="Paste AQ.Ab... API key here - saved only in your browser"><div id="testResult"></div><div id="modes" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div><div id="chips" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div></div>
<div id="chat"></div>
<div id="inputArea"><textarea id="prompt" rows="2" placeholder="Ask anything..."></textarea><div class="row"><button class="btn" onclick="send()">Send to Gemini →</button><button class="btn ghost" onclick="clearChat()">Clear</button></div><small>Model: gemini-3.8-flash is default - 2.5-flash is retired for new users. If black screen happens, reload - this version has no heavy framework.</small></div>
</div></div>
<div id="drawer"><h3>Customize Gemini ✨</h3><small>How should it talk to you? This is sent with every message.</small>
<label>Your name / Nickname</label><input id="pName" placeholder="e.g. Aarav">
<label>What should it call you?</label><input id="pCall" placeholder="e.g. Bro, Bhai, Aarav">
<label>About Me</label><textarea id="pAbout" placeholder="e.g. I am a student, preparing for exams, love coding"></textarea>
<label>Language</label><select id="pLang"><option>English</option><option>Hinglish</option><option>Hindi</option><option>English + Hinglish Mix</option></select>
<label>Tone</label><select id="pTone"><option>Best Friend</option><option>Funny</option><option>Motivational</option><option>Teacher</option><option>Serious</option><option>Savage / Roast</option><option>Professional</option></select>
<label>Chat Style</label><select id="pStyle"><option>Detailed</option><option>Short replies</option><option>Step-by-step</option><option>Bullet points</option><option>Storytelling</option></select>
<label>Emoji Level</label><select id="pEmoji"><option>Some</option><option>None</option><option>Lots</option></select>
<label>Goals</label><input id="pGoals" placeholder="e.g. Crack exam, learn coding">
<label>Custom Instructions - MOST IMPORTANT</label><textarea id="pCustom" rows="4" placeholder="e.g. Talk like my best friend, roast me if I'm lazy, explain in Hinglish, always give examples, remember my goals"></textarea>
<label>Temperature / Creativity: <b id="tempVal">0.7</b></label><input id="temp" type="range" min="0" max="2" step="0.1" value="0.7">
<label>Max Tokens: <b id="tokVal">2048</b></label><input id="toks" type="range" min="256" max="8192" step="256" value="2048">
<label><input type="checkbox" id="pPersonal" checked style="width:auto"> Personalization ON</label>
<div style="background:#111;padding:10px;border-radius:12px;margin-top:10px"><small>Live Preview of instruction sent:</small><div id="preview" style="font-size:12px;white-space:pre-wrap"></div></div>
<button class="btn" onclick="saveAll();toggleDrawer()">Save & Close</button></div>
<script>
window.onerror=function(m){var e=document.getElementById('err');e.style.display='block';e.textContent='Error: '+m+' - Try reload. If still black, open in Chrome latest.';}
var modes={Chat:{sys:'You are helpful.',chips:['Explain like I am 5','Roast my idea','Debate me','Give me a plan']},Study:{sys:'You are a study tutor.',chips:['Make flashcards','Make quiz','Summarize notes','Explain like I am 5']},Code:{sys:'You are a senior coder.',chips:['Fix this bug','Explain this code','Convert to Python','Write tests']},Content:{sys:'You are a viral content writer.',chips:['YouTube titles','Instagram caption','Resume bullets','Cold email']},Planner:{sys:'You are a planner.',chips:['Make timetable','Study plan 10 days']},Translate:{sys:'You are a translator.',chips:['Translate to Hinglish','Translate to Hindi']}};
var curMode='Chat', chats=JSON.parse(localStorage.getItem('gh3_chats')||'[]'), curId=null;
function buildInstruction(){if(!document.getElementById('pPersonal').checked) return modes[curMode].sys; return modes[curMode].sys+'\nPERSONALIZATION: Name='+document.getElementById('pName').value+', Call me='+document.getElementById('pCall').value+', About='+document.getElementById('pAbout').value+', Language='+document.getElementById('pLang').value+', Tone='+document.getElementById('pTone').value+', Style='+document.getElementById('pStyle').value+', Emoji='+document.getElementById('pEmoji').value+', Goals='+document.getElementById('pGoals').value+', Custom Instructions: '+document.getElementById('pCustom').value;}
function updatePreview(){document.getElementById('preview').textContent=buildInstruction();}
function renderModes(){document.getElementById('modes').innerHTML=Object.keys(modes).map(function(m){return '<div class="pill '+(m===curMode?'on':'')+'" onclick="setMode(\''+m+'\')">'+m+'</div>'}).join('');document.getElementById('chips').innerHTML=modes[curMode].chips.map(function(c){return '<span class="pill" onclick="useChip(\''+c+'\')">'+c+'</span>'}).join('');updatePreview();}
function setMode(m){curMode=m;renderModes();saveAll();}
function useChip(c){document.getElementById('prompt').value=c+': ';document.getElementById('prompt').focus();}
function toggleDrawer(){document.getElementById('drawer').classList.toggle('open');updatePreview();}
function toggleSide(){document.getElementById('side').classList.toggle('open');}
function newChat(){var id=Date.now().toString();chats.unshift({id:id,title:'New Chat',msgs:[],time:new Date().toLocaleString()});curId=id;renderChats();renderChat();saveAll();}
function renderChats(){var q=(document.getElementById('search').value||'').toLowerCase();document.getElementById('chats').innerHTML=chats.filter(function(c){return c.title.toLowerCase().includes(q)}).map(function(c){return '<div class="chatItem '+(c.id===curId?'active':'')+'" onclick="openChat(\''+c.id+'\')"><b>'+c.title.replace(/</g,'')+'</b><br><small>'+c.msgs.length+' msgs - '+c.time+'</small></div>'}).join('')||'<small style="padding:10px">No chats yet. Click New Chat.</small>';}
function openChat(id){curId=id;renderChats();renderChat();}
function renderChat(){var c=chats.find(function(x){return x.id===curId});document.getElementById('chat').innerHTML=c?c.msgs.map(function(m){return '<div class="msg '+(m.role==='user'?'user':'ai')+'">'+m.text.replace(/</g,'&lt;')+'</div>'}).join(''):'';var ch=document.getElementById('chat');ch.scrollTop=ch.scrollHeight;}
function saveAll(){try{localStorage.setItem('gh3_key',document.getElementById('apiKey').value);localStorage.setItem('gh3_model',document.getElementById('model').value);localStorage.setItem('gh3_chats',JSON.stringify(chats));localStorage.setItem('gh3_pers',JSON.stringify({name:document.getElementById('pName').value,call:document.getElementById('pCall').value,about:document.getElementById('pAbout').value,lang:document.getElementById('pLang').value,tone:document.getElementById('pTone').value,style:document.getElementById('pStyle').value,emoji:document.getElementById('pEmoji').value,goals:document.getElementById('pGoals').value,custom:document.getElementById('pCustom').value}));}catch(e){}updateBadge();}
function loadAll(){try{document.getElementById('apiKey').value=localStorage.getItem('gh3_key')||'';var p=JSON.parse(localStorage.getItem('gh3_pers')||'{}');document.getElementById('pName').value=p.name||'';document.getElementById('pCall').value=p.call||'';document.getElementById('pAbout').value=p.about||'';document.getElementById('pLang').value=p.lang||'English';document.getElementById('pTone').value=p.tone||'Best Friend';document.getElementById('pStyle').value=p.style||'Detailed';document.getElementById('pEmoji').value=p.emoji||'Some';document.getElementById('pGoals').value=p.goals||'';document.getElementById('pCustom').value=p.custom||'';}catch(e){} if(!chats.length) newChat(); else {curId=chats[0].id;renderChats();renderChat();} updateBadge();}
function updateBadge(){var k=document.getElementById('apiKey').value.trim();document.getElementById('badge').textContent=k.indexOf('AQ.')===0?'✅ New Auth Key':k.indexOf('AIza')===0?'Legacy Key':k?'Key entered':'No key';}
async function testKey(){var k=document.getElementById('apiKey').value.trim();if(!k){alert('Paste key first');return;}saveAll();var el=document.getElementById('testResult');el.innerHTML='Testing...';try{var r=await fetch('https://generativelanguage.googleapis.com/v1beta/models',{headers:{'x-goog-api-key':k}});var t=await r.text();var j={};try{j=JSON.parse(t)}catch(e){} if(r.ok){var names=(j.models||[]).map(function(m){return m.name.replace('models/','')}).filter(function(n){return n.indexOf('gemini')>-1});var sel=document.getElementById('model');var cur=sel.value;sel.innerHTML='';var list=names.length?names:['gemini-3.8-flash','gemini-3-flash'];list.forEach(function(n){var o=document.createElement('option');o.textContent=n;sel.appendChild(o);});sel.value=list.indexOf(cur)>-1?cur:(list.indexOf('gemini-3.8-flash')>-1?'gemini-3.8-flash':list[0]);el.innerHTML='✅ Connected! Found '+names.length+' models. Using '+sel.value;}else{el.innerHTML='❌ Failed '+r.status+' '+t.slice(0,500);}}catch(e){el.innerHTML='❌ Blocked: '+e.message+' - Open in Chrome, not preview.';}}
async function send(){var k=document.getElementById('apiKey').value.trim();if(!k){alert('Paste API key first');return;}var q=document.getElementById('prompt').value.trim();if(!q)return;var c=chats.find(function(x){return x.id===curId});if(!c) newChat(),c=chats[0];if(c.msgs.length===0) c.title=q.slice(0,30);c.msgs.push({role:'user',text:q});document.getElementById('prompt').value='';renderChat();renderChats();saveAll();var model=document.getElementById('model').value;c.msgs.push({role:'ai',text:'Thinking...'});renderChat();try{var r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify({systemInstruction:{parts:[{text:buildInstruction()}]},contents:[{parts:[{text:q}]}],generationConfig:{temperature:parseFloat(document.getElementById('temp').value),maxOutputTokens:parseInt(document.getElementById('toks').value)}})});var d=await r.json();var ans=d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts?d.candidates[0].content.parts.map(function(p){return p.text}).join(''):('Error: '+JSON.stringify(d).slice(0,800));c.msgs[c.msgs.length-1].text=ans;}catch(e){c.msgs[c.msgs.length-1].text='Blocked: '+e.message+' - Open this file in Chrome.';}renderChat();saveAll();}
function clearChat(){var c=chats.find(function(x){return x.id===curId});if(c){c.msgs=[];renderChat();saveAll();}}
document.getElementById('temp').oninput=function(e){document.getElementById('tempVal').textContent=e.target.value;updatePreview();};
document.getElementById('toks').oninput=function(e){document.getElementById('tokVal').textContent=e.target.value;};
document.getElementById('apiKey').oninput=function(){updateBadge();saveAll();};
['pName','pCall','pAbout','pLang','pTone','pStyle','pEmoji','pGoals','pCustom','pPersonal'].forEach(function(id){document.getElementById(id).oninput=function(){updatePreview();saveAll();};});
renderModes();loadAll();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
